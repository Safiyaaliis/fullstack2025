<h3>Subscribe to get the newest mocktail recipes!</h3>
<p>Your go-to source for the latest mocktail recipes.</p>

<form id="subscribeForm" class="lab-form" novalidate>
  <label>
    Name:
    <input type="text" id="subscriberName" name="subscriberName" placeholder="Your name" required>
  </label>

  <label>
    Email:
    <input type="email" id="email" name="email" placeholder="you@example.com" required>
  </label>

  <label class="consent">
    <input type="checkbox" id="consent" name="consent" required>
    I agree to receive mocktail updates.
  </label>

  <button type="submit">Subscribe</button>

  <ul id="subscribeErrors" class="form-errors" aria-live="polite"></ul>
  <p id="subscribeMessage" class="form-message" aria-live="polite"></p>
</form>
